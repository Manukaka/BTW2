<script>
'use strict';
/* =========================================================================
   BEYOND TOURISM WORLD — TRAVEL OPS CRM  (v2)
   Single-file app. Works standalone; optional Supabase backend adds team
   login, multi-device sync and public inquiry-form capture.
   ========================================================================= */

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function fmtMoney(n){ n=Number(n)||0; return (STATE?.settings?.currency||'₹') + n.toLocaleString('en-IN',{maximumFractionDigits:0}); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(String(d).length===10?d+'T00:00:00':d);
  return isNaN(dt)?d:dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateShort(d){ if(!d) return '—'; const dt=new Date(String(d).length===10?d+'T00:00:00':d);
  return isNaN(dt)?d:dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function nightsBetween(a,b){ if(!a||!b) return 0;
  return Math.max(0, Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)); }

function toast(msg, kind='ok'){
  const c={ok:'bg-navy text-white',err:'bg-danger text-white',warn:'bg-gold text-navy'};
  const t=el(`<div class="toast ${c[kind]} shadow-pop rounded-lg px-4 py-2.5 text-sm font-medium max-w-xs">${esc(msg)}</div>`);
  $('#toast-root').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); },2600);
}

// =========================================================================
// CONSTANTS
// =========================================================================
const LANGUAGES = ['English','Hindi','Marathi','Gujarati','Bengali','Tamil','Telugu','Kannada',
  'Malayalam','Punjabi','French','German','Spanish','Arabic'];

const TRAVELLER_TYPES = ['Family','Couple / Honeymoon','Friends group','Solo','Senior citizens','Corporate group','School / College group'];
const TRAVEL_PACE = ['Relaxed','Balanced','Packed'];
const BUDGET_LEVELS = ['Budget','Mid-range','Luxury','Premium Luxury'];

const LEAD_STAGES = [
  {key:'New', label:'New', color:'#1F7A6C'},
  {key:'Contacted', label:'Contacted', color:'#C98A3D'},
  {key:'Proposal Sent', label:'Proposal Sent', color:'#12303D'},
  {key:'Negotiation', label:'Negotiation', color:'#7A5CA8'},
  {key:'Won', label:'Won', color:'#2F8F5B'},
  {key:'Lost', label:'Lost', color:'#B8483D'},
];
const LEAD_SOURCES = ['WhatsApp','Website Form','Instagram','Facebook','Referral','Google Ads','Walk-in','B2B Marketplace','Corporate','Other'];
const ITIN_STATUSES = ['Draft','Sent to Client','Confirmed','Completed','Cancelled'];
const BOOKING_STATUSES = ['Confirmed','Ongoing','Completed','Cancelled'];
const ACTIVITY_TYPES = ['Call (outgoing)','Call (incoming)','Call (missed)','WhatsApp','Email','Meeting','Note'];

const INVOICE_TYPES = [
  {value:'Package Tour', label:'Package Tour (5% GST)'},
  {value:'Service Fee', label:'Service Fee (18% GST)'},
  {value:'Visa Assistance', label:'Visa Assistance (18% GST)'},
  {value:'Hotel Only', label:'Hotel Only (18% GST)'},
  {value:'Other', label:'Other'},
];
function defaultGstFor(t){ return t==='Package Tour' ? 5 : (t==='Other' ? 0 : 18); }

const VISA_STAGES = [
  {key:'Document Collected', label:'Docs Collected', color:'#6B7680'},
  {key:'Under Process', label:'Under Process', color:'#C98A3D'},
  {key:'Approved', label:'Approved', color:'#2F8F5B'},
  {key:'Rejected', label:'Rejected', color:'#B8483D'},
  {key:'Delivered', label:'Delivered', color:'#1F7A6C'},
];

// Country-wise visa document checklists. Editable per case after creation.
const VISA_CHECKLISTS = {
  'Schengen (Europe)': ['Passport (6 months validity)','Photographs (35x45mm, white bg)','Visa application form','Bank statement (6 months)','ITR (3 years)','Confirmed flight booking','Hotel bookings','Travel insurance (€30,000)','Cover letter','Employment / leave letter'],
  'UAE / Dubai': ['Passport first & last page','Photograph (white bg)','Confirmed flight ticket','Hotel booking','PAN card copy'],
  'Vietnam': ['Passport scan (6 months validity)','Photograph (4x6, white bg)','e-Visa application form','Confirmed flight itinerary','Hotel booking'],
  'Thailand': ['Passport (6 months validity)','Photograph (35x45mm)','Bank statement (6 months)','Confirmed return ticket','Hotel booking'],
  'Singapore': ['Passport (6 months validity)','Photograph (35x45mm, white bg)','Form 14A','Bank statement (3 months)','Covering letter','Confirmed air ticket'],
  'Malaysia': ['Passport (6 months validity)','Photograph','Confirmed return ticket','Hotel booking','Bank statement'],
  'Sri Lanka': ['Passport (6 months validity)','ETA application','Return ticket','Hotel booking'],
  'United Kingdom': ['Passport','Photograph','Online application','Bank statement (6 months)','ITR (3 years)','Employment letter','Accommodation details','Travel itinerary'],
  'USA': ['Passport','DS-160 confirmation','Photograph (2x2 inch)','Visa fee receipt','Interview appointment letter','Bank statement','ITR (3 years)','Employment proof'],
  'Australia': ['Passport','Photograph','Application form','Bank statement (6 months)','ITR','Employment letter','Travel itinerary'],
  'Japan': ['Passport','Photograph (45x45mm)','Application form','Bank statement','ITR','Daily schedule','Confirmed flight booking'],
  'Other / Custom': ['Passport','Photograph','Application form','Bank statement','Confirmed flight booking','Hotel booking'],
};

const DEFAULT_INCLUSIONS = [
  'Accommodation on twin-sharing basis',
  'Daily breakfast at the hotel',
  'All transfers and sightseeing by private vehicle',
  'All applicable toll, parking and driver allowance',
  'Assistance on arrival',
];
const DEFAULT_EXCLUSIONS = [
  'Airfare and visa fees unless specified',
  'Travel insurance',
  'Lunch, dinner and personal expenses',
  'Entry tickets to monuments unless specified',
  'Anything not mentioned under inclusions',
];
const DEFAULT_TERMS =
`Booking confirmed only against advance payment. Rates are subject to availability at the time of confirmation. Cancellation charges apply as per hotel and supplier policy. Government taxes are payable extra where applicable.`;

// ---------- WhatsApp & Maps link builders (no API key needed) ----------
function waNumber(raw){ return String(raw||'').replace(/[^\d]/g,''); }
function waLink(phone, text){
  const n = waNumber(phone);
  return `https://wa.me/${n}?text=${encodeURIComponent(text||'')}`;
}
function openWhatsApp(phone, text){
  const n = waNumber(phone);
  if(!n){ toast('No phone number on file for this contact','warn'); return; }
  window.open(waLink(phone,text), '_blank');
}
function mapsSearchLink(query){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query||'')}`;
}
function mapsDirectionsLink(from, to){
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from||'')}&destination=${encodeURIComponent(to||'')}`;
}

// =========================================================================
// STATE + PERSISTENCE (local always; Supabase optional for team sync)
// =========================================================================
let STATE = null;
const STORAGE_KEY = 'btw_crm_state_v2';
const CONFIG_KEY  = 'btw_crm_config_v2';   // integration keys, kept per-device
const INSIDE_CLAUDE_ARTIFACT = (typeof window.storage !== 'undefined');

let CONFIG = { supabaseUrl:'', supabaseAnonKey:'', backendUrl:'', backendCode:'', mapsApiKey:'', aiProvider:'anthropic', aiApiKey:'', aiModel:'' };
let SB = null;              // supabase client when configured
let SESSION = null;         // supabase auth session
let SYNC = 'local';         // 'local' | 'online' | 'offline-forced'
let saveTimer = null;

const Local = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
};

async function persistGet(key){
  if(INSIDE_CLAUDE_ARTIFACT){
    try{ const r = await window.storage.get(key,false); if(r && r.value) return r.value; }catch(e){}
  }
  return Local.get(key);
}
async function persistSet(key,val){
  if(INSIDE_CLAUDE_ARTIFACT){
    try{ await window.storage.set(key,val,false); return true; }catch(e){}
  }
  return Local.set(key,val);
}

function defaultState(){
  return {
    settings: {
      agencyName:'Beyond Tourism World',
      ceoName:'Gautam Pawar',
      agencyPhone:'', agencyEmail:'', agencyAddress:'', website:'',
      gstNumber:'', currency:'₹',
      invoicePrefix:'BTW-INV', receiptPrefix:'BTW-RCPT', financialYear:'25-26',
      googleReviewUrl:'',
      logoUrl:'',
      team:[{id:uid(), name:'Gautam Pawar', role:'CEO'}],
    },
    leads:[], itineraries:[], bookings:[], invoices:[], payments:[],
    tasks:[], vendors:[], visaCases:[], companies:[], feedback:[],
    counters:{ invoice:0, receipt:0 },
  };
}

function backfillState(){
  const d = defaultState();
  for(const k in d){ if(!(k in STATE)) STATE[k] = d[k]; }
  for(const k in d.settings){ if(!(k in STATE.settings)) STATE.settings[k] = d.settings[k]; }
  for(const k in d.counters){ if(!(k in STATE.counters)) STATE.counters[k] = d.counters[k]; }
  // per-record backfills so older saves keep working
  STATE.leads.forEach(l => { l.activity = l.activity || []; l.assignedTo = l.assignedTo || ''; });
  STATE.itineraries.forEach(i => {
    i.language = i.language || 'English';
    i.inclusions = i.inclusions || DEFAULT_INCLUSIONS.slice();
    i.exclusions = i.exclusions || DEFAULT_EXCLUSIONS.slice();
    i.terms = i.terms ?? DEFAULT_TERMS;
    i.options = i.options || [];
    i.coverPhoto = i.coverPhoto || '';
    i.videoUrl = i.videoUrl || '';
    (i.days||[]).forEach(d=>{ d.photo = d.photo || ''; });
  });
}

function nextInvoiceNo(){
  STATE.counters.invoice += 1;
  return `${STATE.settings.invoicePrefix}/${STATE.settings.financialYear}/${String(STATE.counters.invoice).padStart(3,'0')}`;
}
function nextReceiptNo(){
  STATE.counters.receipt += 1;
  return `${STATE.settings.receiptPrefix}/${STATE.settings.financialYear}/${String(STATE.counters.receipt).padStart(3,'0')}`;
}

// ---------- Supabase layer ----------
function sbReady(){ return !!(SB && SESSION); }

function initSupabaseClient(){
  if(!CONFIG.supabaseUrl || !CONFIG.supabaseAnonKey) { SB = null; return false; }
  if(typeof window.supabase === 'undefined'){ console.warn('supabase-js not loaded'); return false; }
  try{
    SB = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
    return true;
  }catch(err){ console.error('supabase init failed', err); SB = null; return false; }
}

async function sbLoadState(){
  const { data, error } = await SB.from('crm_state').select('data').eq('id', 1).maybeSingle();
  if(error) throw error;
  return data ? data.data : null;
}
async function sbSaveState(){
  const { error } = await SB.from('crm_state').upsert({ id:1, data:STATE, updated_at:new Date().toISOString() });
  if(error) throw error;
}
async function sbFetchInquiries(){
  const { data, error } = await SB.from('inquiries').select('*').eq('imported', false).order('created_at',{ascending:false});
  if(error) throw error;
  return data || [];
}
async function sbMarkInquiryImported(id){
  await SB.from('inquiries').update({ imported:true }).eq('id', id);
}

function setSyncBadge(){
  const dot = $('#sync-dot'), txt = $('#sync-text');
  if(!dot) return;
  if(SYNC === 'online'){ dot.className='sync-dot bg-success'; txt.textContent = 'Team sync on'; }
  else if(SYNC === 'offline-forced'){ dot.className='sync-dot bg-gold'; txt.textContent = 'Offline — not syncing'; }
  else { dot.className='sync-dot bg-white/30'; txt.textContent = 'This device only'; }
}

// ---------- Backend function (Supabase Edge Function) ----------
function backendReady(){ return !!(CONFIG.backendUrl && (sbReady() || CONFIG.backendCode)); }
function backendToken(){ return sbReady() ? SESSION.access_token : CONFIG.backendCode; }
async function callBackend(task, payload){
  if(!backendReady()) throw new Error('Backend not connected');
  const headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+backendToken() };
  if(CONFIG.supabaseAnonKey) headers['apikey'] = CONFIG.supabaseAnonKey;
  const resp = await fetch(CONFIG.backendUrl, { method:'POST', headers, body: JSON.stringify({ task, payload }) });
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok || data.error) throw new Error(data.error || ('Backend error '+resp.status));
  return data;
}

// ---------- AI (three ways, first available wins) ----------
// 1) Backend function — the key lives in Netlify env vars (best for the whole team)
// 2) API key saved on this device (Settings → AI assistant) — quickest, per browser
// 3) Inside a Claude artifact the key is injected automatically
const AI_DEFAULT_MODEL = { anthropic:'claude-opus-5', gemini:'gemini-2.0-flash' };
const AI_PROVIDER_LABEL = { anthropic:'Anthropic Claude', gemini:'Google Gemini' };
const PASSPORT_OCR_SYSTEM = `You read passport photos for a travel agency. Extract fields and reply with ONLY a JSON object, no commentary:
{"fullName":"Given names + surname as printed","passportNumber":"","nationality":"","dateOfBirth":"YYYY-MM-DD","expiryDate":"YYYY-MM-DD","issueDate":"YYYY-MM-DD","sex":"","placeOfBirth":""}
Use the MRZ lines to verify the passport number, DOB and expiry when visible. Leave a field as empty string if unreadable. Never guess.`;
const CARD_OCR_SYSTEM = `You read business cards for a travel agency's vendor database. Reply with ONLY a JSON object, no commentary:
{"name":"person's name","designation":"","company":"","phone":"primary phone with country code if shown","email":"","website":"","address":"","city":""}
Leave unreadable fields as empty strings. Never invent values.`;

function aiProvider(){ return CONFIG.aiProvider==='gemini' ? 'gemini' : 'anthropic'; }
function aiModel(){ return (CONFIG.aiModel||'').trim() || AI_DEFAULT_MODEL[aiProvider()]; }
function aiDirectReady(){ return !!(CONFIG.aiApiKey||'').trim(); }
function aiReady(){ return backendReady() || aiDirectReady() || INSIDE_CLAUDE_ARTIFACT; }
function aiNotSetupMessage(){ return 'AI is not set up yet — paste an API key in Settings → AI assistant, or connect the backend.'; }

async function callAnthropicDirect(system, content, maxTokens){
  const headers = { 'Content-Type':'application/json', 'anthropic-version':'2023-06-01' };
  const body = { model: aiModel(), max_tokens:maxTokens, system, messages:[{role:'user', content}] };
  if(aiDirectReady()){
    headers['x-api-key'] = CONFIG.aiApiKey.trim();
    headers['anthropic-dangerous-direct-browser-access'] = 'true';   // required for browser → api.anthropic.com
    headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';    // if the model declines, Anthropic retries on a fallback model
    body.fallbacks = 'default';
  }
  const resp = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers, body: JSON.stringify(body) });
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error(data?.error?.message || ('AI request failed ('+resp.status+')'));
  if(data.stop_reason==='refusal') throw new Error('The AI declined this request');
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
async function callGeminiDirect(system, parts, maxTokens){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(aiModel())+':generateContent';
  const resp = await fetch(url, {
    method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key':CONFIG.aiApiKey.trim() },
    body: JSON.stringify({ systemInstruction:{ parts:[{text:system}] }, contents:[{ role:'user', parts }],
      generationConfig:{ maxOutputTokens:maxTokens, temperature:0.4 } })
  });
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error(data?.error?.message || ('AI request failed ('+resp.status+')'));
  return (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');
}
// Text in → text out, using whichever route is available (backend first).
async function aiText(system, prompt, maxTokens=1000){
  if(!INSIDE_CLAUDE_ARTIFACT && backendReady()){ const r = await callBackend('ai_itinerary', { system, prompt }); return r.text||''; }
  return aiDirectText(system, prompt, maxTokens);
}
// Same, but always uses the key saved on this device (or the Claude artifact) — used by "Test AI".
async function aiDirectText(system, prompt, maxTokens=1000){
  if(aiDirectReady() && aiProvider()==='gemini') return callGeminiDirect(system, [{text:prompt}], maxTokens);
  if(aiDirectReady() || INSIDE_CLAUDE_ARTIFACT) return callAnthropicDirect(system, prompt, maxTokens);
  throw new Error(aiNotSetupMessage());
}
// Photo of a passport / business card → {fields}. task = 'ocr_passport' | 'ocr_card'
async function aiOcr(task, file){
  const image = await fileToBase64(file), mediaType = file.type||'image/jpeg';
  if(!INSIDE_CLAUDE_ARTIFACT && backendReady()){ const r = await callBackend(task, { image, mediaType }); return r.fields||{}; }
  const system = task==='ocr_passport' ? PASSPORT_OCR_SYSTEM : CARD_OCR_SYSTEM;
  let text;
  if(aiDirectReady() && aiProvider()==='gemini')
    text = await callGeminiDirect(system, [{ inlineData:{ mimeType:mediaType, data:image } }, { text:'Extract the fields.' }], 600);
  else if(aiDirectReady() || INSIDE_CLAUDE_ARTIFACT)
    text = await callAnthropicDirect(system, [{ type:'image', source:{ type:'base64', media_type:mediaType, data:image } }, { type:'text', text:'Extract the fields.' }], 600);
  else throw new Error(aiNotSetupMessage());
  try{ return JSON.parse(text.replace(/```json|```/g,'').trim()) || {}; }
  catch(e){ throw new Error('Could not read the document'); }
}
function publicBase(){ return location.origin + location.pathname.replace(/[^/]*$/,''); }
function fileToBase64(file){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
}
function pickImage(){
  return new Promise(res=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>res(inp.files[0]||null); inp.click();
  });
}

async function saveState(){
  await persistSet(STORAGE_KEY, JSON.stringify(STATE));
  if(SYNC === 'online'){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{ await sbSaveState(); }
      catch(err){ console.error(err); toast('Cloud save failed — saved on this device','warn'); }
    }, 900);
  }
}

async function loadLocalState(){
  const raw = await persistGet(STORAGE_KEY);
  if(raw){ try{ STATE = JSON.parse(raw); backfillState(); return true; }catch(e){} }
  return false;
}

function closeModal(){ $('#modal-root').innerHTML = ''; }

function openModal({title, bodyHTML, footHTML, onMount, wide=false, xwide=false}){
  const w = xwide ? 'max-w-4xl' : (wide ? 'max-w-2xl' : 'max-w-md');
  $('#modal-root').innerHTML = `
    <div class="modal-overlay fixed inset-0 z-40 flex items-center justify-center p-4" data-action="modal-overlay">
      <div class="modal-panel bg-white rounded-2xl w-full ${w} max-h-[88vh] flex flex-col" data-stop>
        <div class="flex items-center justify-between px-5 py-4 border-b border-line shrink-0">
          <h3 class="font-display text-lg font-semibold">${title}</h3>
          <button class="btn btn-ghost btn-sm" data-action="modal-close">✕</button>
        </div>
        <div class="px-5 py-4 overflow-y-auto">${bodyHTML}</div>
        ${footHTML ? `<div class="px-5 py-4 border-t border-line shrink-0">${footHTML}</div>` : ''}
      </div>
    </div>`;
  $('[data-action="modal-overlay"]').addEventListener('click', e => { if(!e.target.closest('[data-stop]')) closeModal(); });
  if(onMount) onMount();
}

function fieldHTML(f){
  const req = f.required ? 'required' : '';
  const val = f.value ?? '';
  const wrap = inner => `<div class="${f.full?'sm:col-span-2':''} mb-3"><label class="field-label">${esc(f.label)}${f.required?' *':''}</label>${inner}${f.hint?`<div class="text-[11px] text-muted mt-1">${esc(f.hint)}</div>`:''}</div>`;
  if(f.type==='select'){
    return wrap(`<select name="${f.name}" ${req}>${f.options.map(o=>{
      const ov = typeof o==='object'?o.value:o, ol = typeof o==='object'?o.label:o;
      return `<option value="${esc(ov)}" ${String(val)===String(ov)?'selected':''}>${esc(ol)}</option>`;
    }).join('')}</select>`);
  }
  if(f.type==='textarea') return wrap(`<textarea name="${f.name}" rows="${f.rows||3}" placeholder="${esc(f.placeholder||'')}" ${req}>${esc(val)}</textarea>`);
  if(f.type==='checkbox') return `<div class="${f.full?'sm:col-span-2':''} mb-3 flex items-center gap-2 pt-5"><input type="checkbox" name="${f.name}" id="fld-${f.name}" ${val?'checked':''} class="w-4 h-4"><label for="fld-${f.name}" class="text-sm font-medium">${esc(f.label)}</label></div>`;
  return wrap(`<input type="${f.type||'text'}" name="${f.name}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}" ${f.step?`step="${f.step}"`:''} ${req}>`);
}

function openFormModal({title, fields, onSubmit, submitLabel='Save', wide=false, extraFootLeft='', onMount}){
  fields = fields.filter(Boolean);
  openModal({
    title, wide,
    bodyHTML:`<form id="generic-form" class="grid grid-cols-1 sm:grid-cols-2 gap-x-4">${fields.map(fieldHTML).join('')}</form>`,
    footHTML:`<div class="flex items-center justify-between gap-2">
        <div>${extraFootLeft}</div>
        <div class="flex gap-2">
          <button type="button" class="btn btn-outline" data-action="modal-close">Cancel</button>
          <button type="submit" form="generic-form" class="btn btn-primary">${submitLabel}</button>
        </div></div>`,
    onMount: () => {
      $('#generic-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target), out = {};
        fields.forEach(f => {
          if(f.type==='checkbox') out[f.name] = fd.get(f.name)==='on';
          else if(f.type==='number') out[f.name] = fd.get(f.name)==='' ? null : Number(fd.get(f.name));
          else out[f.name] = fd.get(f.name) ?? '';
        });
        onSubmit(out);
      });
      if(onMount) onMount();
    }
  });
}

function confirmDialog(message, onYes){
  openModal({
    title:'Please confirm',
    bodyHTML:`<p class="text-sm">${esc(message)}</p>`,
    footHTML:`<div class="flex justify-end gap-2">
        <button class="btn btn-outline" data-action="modal-close">Cancel</button>
        <button class="btn btn-danger" id="confirm-yes-btn">Yes, continue</button></div>`,
    onMount: () => $('#confirm-yes-btn').addEventListener('click', ()=>{ closeModal(); onYes(); })
  });
}

function renderTable({columns, rows, emptyText='Nothing here yet.'}){
  if(!rows.length) return `<div class="text-center py-14 text-muted text-sm border border-dashed border-line rounded-xl">${esc(emptyText)}</div>`;
  return `<div class="ticket overflow-x-auto"><table class="w-full text-sm min-w-[640px]">
      <thead><tr class="text-left board-label text-[10.5px] text-muted border-b border-line">
        ${columns.map(c=>`<th class="px-4 py-3 font-semibold">${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr class="border-b border-line last:border-0 hover:bg-paper/70">
        ${columns.map(c=>`<td class="px-4 py-3 align-middle">${c.render?c.render(r):esc(r[c.key] ?? '—')}</td>`).join('')}
      </tr>`).join('')}</tbody></table></div>`;
}

function renderKanban({stages, items, stageKey='stage', renderCard}){
  return `<div class="flex gap-4 overflow-x-auto pb-2">${stages.map(s=>{
    const inStage = items.filter(i=>i[stageKey]===s.key);
    return `<div class="kanban-col flex flex-col">
      <div class="flex items-center justify-between mb-2 px-1">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full" style="background:${s.color}"></span>
          <span class="board-label text-[11px] text-navy font-semibold">${esc(s.label)}</span>
        </div>
        <span class="text-[11px] text-muted font-mono">${inStage.length}</span>
      </div>
      <div class="flex flex-col gap-2.5 min-h-[60px] p-1 rounded-xl" data-drop-zone="${esc(s.key)}">
        ${inStage.map(i=>renderCard(i)).join('') || `<div class="text-[12px] text-muted italic px-2 py-3">No items</div>`}
      </div></div>`;
  }).join('')}</div>`;
}

function wireKanbanDnD(container, moveAction){
  container.querySelectorAll('.kanban-card').forEach(c=>{
    c.addEventListener('dragstart', ()=>c.classList.add('dragging'));
    c.addEventListener('dragend', ()=>c.classList.remove('dragging'));
  });
  container.querySelectorAll('[data-drop-zone]').forEach(z=>{
    z.addEventListener('dragover', e=>{ e.preventDefault(); z.parentElement.classList.add('drag-over'); });
    z.addEventListener('dragleave', ()=>z.parentElement.classList.remove('drag-over'));
    z.addEventListener('drop', e=>{
      e.preventDefault(); z.parentElement.classList.remove('drag-over');
      const d = container.querySelector('.dragging'); if(!d) return;
      moveAction(d.dataset.id, z.dataset.dropZone);
    });
  });
}

function printHTML(inner){
  const a = $('#print-area');
  a.innerHTML = inner;
  a.classList.remove('hidden');
  setTimeout(()=>window.print(), 60);
}

// QR code as a data URL, using qrcodejs into an offscreen node
function qrDataUrl(text, size=140){
  return new Promise(resolve=>{
    const holder = $('#qr-scratch');
    holder.innerHTML = '';
    try{
      new QRCode(holder, { text: text || ' ', width:size, height:size, correctLevel: QRCode.CorrectLevel.M });
      setTimeout(()=>{
        const cvs = holder.querySelector('canvas');
        const img = holder.querySelector('img');
        if(cvs) return resolve(cvs.toDataURL('image/png'));
        if(img && img.src) return resolve(img.src);
        resolve('');
      }, 120);
    }catch(err){ console.error('QR failed', err); resolve(''); }
  });
}

let paletteResults = [], paletteSel = 0;

function paletteSearch(q){
  q = q.trim().toLowerCase();
  const out = [];
  const push = (type,label,sub,view,id) => out.push({type,label,sub,view,id});
  if(!q){
    NAV.forEach(n=>push('Go to', n.label, n.eyebrow, n.key, null));
    return out.slice(0,8);
  }
  NAV.forEach(n=>{ if(n.label.toLowerCase().includes(q)) push('Go to', n.label, n.eyebrow, n.key, null); });
  STATE.leads.forEach(l=>{ if((l.name+l.destination+l.phone+(l.email||'')).toLowerCase().includes(q)) push('Lead', l.name, l.destination, 'leads', null); });
  STATE.itineraries.forEach(i=>{ if((i.name+i.destination+i.clientName).toLowerCase().includes(q)) push('Itinerary', i.name, i.destination, 'itineraries', i.id); });
  STATE.bookings.forEach(b=>{ if((b.clientName+b.destination).toLowerCase().includes(q)) push('Booking', b.clientName, b.destination, 'bookings', null); });
  STATE.invoices.forEach(i=>{ if((i.invoiceNo+i.clientName).toLowerCase().includes(q)) push('Invoice', i.invoiceNo, i.clientName, 'invoices', null); });
  STATE.vendors.forEach(v=>{ if((v.name+v.category+(v.city||'')).toLowerCase().includes(q)) push('Vendor', v.name, v.category, 'vendors', null); });
  STATE.companies.forEach(c=>{ if(c.name.toLowerCase().includes(q)) push('Company', c.name, c.contactPerson||'', 'corporate', c.id); });
  STATE.visaCases.forEach(v=>{ if((v.clientName+v.country).toLowerCase().includes(q)) push('Visa case', v.clientName, v.country, 'visa', null); });
  return out.slice(0,12);
}

function renderPaletteList(){
  const box = $('#palette-list'); if(!box) return;
  if(!paletteResults.length){ box.innerHTML = `<div class="px-4 py-6 text-sm text-muted text-center">No matches.</div>`; return; }
  box.innerHTML = paletteResults.map((r,i)=>`
    <button class="palette-item w-full text-left px-4 py-2.5 flex items-center justify-between text-sm ${i===paletteSel?'sel':''}"
      data-action="palette-go" data-i="${i}">
      <span class="truncate"><span class="font-medium">${esc(r.label)}</span><span class="text-muted"> — ${esc(r.sub||'')}</span></span>
      <span class="board-label text-[10px] text-muted shrink-0 ml-2">${esc(r.type)}</span>
    </button>`).join('');
}

function openPalette(){
  paletteSel = 0; paletteResults = paletteSearch('');
  $('#palette-root').innerHTML = `
    <div class="modal-overlay fixed inset-0 z-50 flex items-start justify-center p-4 pt-24" data-action="palette-overlay">
      <div class="bg-white rounded-2xl w-full max-w-lg shadow-pop overflow-hidden" data-stop>
        <input id="palette-input" type="text" placeholder="Search leads, itineraries, invoices, vendors…"
          class="!border-0 !rounded-none !border-b !border-line !px-4 !py-3.5 text-sm" autocomplete="off">
        <div id="palette-list" class="max-h-80 overflow-y-auto"></div>
      </div></div>`;
  renderPaletteList();
  const input = $('#palette-input');
  input.focus();
  input.addEventListener('input', ()=>{ paletteResults = paletteSearch(input.value); paletteSel = 0; renderPaletteList(); });
  input.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); paletteSel=Math.min(paletteSel+1, paletteResults.length-1); renderPaletteList(); }
    if(e.key==='ArrowUp'){ e.preventDefault(); paletteSel=Math.max(paletteSel-1,0); renderPaletteList(); }
    if(e.key==='Enter'){ e.preventDefault(); paletteGo(paletteSel); }
  });
  $('[data-action="palette-overlay"]').addEventListener('click', e=>{ if(!e.target.closest('[data-stop]')) closePalette(); });
}
function closePalette(){ $('#palette-root').innerHTML=''; }
function paletteGo(i){
  const r = paletteResults[i]; if(!r) return;
  closePalette(); navigate(r.view, r.id);
}

// ---------- Free photo lookup (Wikipedia page images, no API key) ----------
const PHOTO_STOP = /\b(arrival|arrive|departure|depart|day|fly|flight|to|in|at|the|and|of|transfer|check[- ]?in|check[- ]?out|free|leisure|begins|ends|city|tour|visit|explore)\b/gi;
const BAD_PHOTO = /flag|coat_of_arms|emblem|seal_of|locator|_map|map_of|\.svg|logo|icon|diagram|chart/i;
async function wikiImage(query){
  if(!query) return '';
  const url = 'https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=4&gsrsearch='
    + encodeURIComponent(query) + '&prop=pageimages&pithumbsize=1000&format=json&origin=*';
  try{
    const r = await fetch(url); const j = await r.json();
    const pages = j.query && j.query.pages ? Object.values(j.query.pages).sort((a,b)=>(a.index||0)-(b.index||0)) : [];
    for(const pg of pages){ const src = pg?.thumbnail?.source || ''; if(src && !BAD_PHOTO.test(src)) return src; }
    return '';
  }catch(e){ return ''; }
}
async function fetchPhotos(itId){
  const it = STATE.itineraries.find(x=>x.id===itId); if(!it) return;
  toast('Looking up photos…');
  let found=0;
  if(!it.coverPhoto){
    const place = it.destination.split(',')[0].trim();          // "Bali, Indonesia" → "Bali"
    it.coverPhoto = (await wikiImage('Tourism in '+place)) || (await wikiImage(place)) || (await wikiImage(it.destination));
    if(it.coverPhoto) found++; }
  for(const d of it.days){
    if(d.photo) continue;
    const clean = (d.title||'').replace(/[→\-–—,/]/g,' ').replace(PHOTO_STOP,' ').replace(/\s+/g,' ').trim();
    const tries = [clean && clean+' '+it.destination, clean, d.hotel && d.hotel+' '+it.destination, it.destination].filter(Boolean);
    for(const q of tries){ d.photo = await wikiImage(q); if(d.photo) break; }
    if(d.photo) found++;
  }
  saveState(); render();
  toast(found ? `${found} photo(s) added — replace any that don't fit by pasting your own link` : 'No photos found — paste image links manually', found?'ok':'warn');
}

function updateItineraryField(id, field, value){
  const it = STATE.itineraries.find(x=>x.id===id); if(!it) return;

  saveState();
}
function updateItineraryList(id, field, value){
  const it = STATE.itineraries.find(x=>x.id===id); if(!it) return;
  it[field] = value.split('\n').map(s=>s.trim()).filter(Boolean);
  saveState();
}
function updateDayField(itId, dayId, field, value){
  const d = STATE.itineraries.find(x=>x.id===itId)?.days.find(x=>x.id===dayId);
  if(d){ d[field]=value; saveState(); }
}
function addDay(itId){
  const it = STATE.itineraries.find(x=>x.id===itId); if(!it) return;
  const last = it.days.length ? it.days[it.days.length-1].date : (it.startDate||todayISO());
  it.days.push({id:uid(), date: it.days.length?addDays(last,1):last, title:'', hotel:'', transport:'', notes:''});

}
function deleteDay(itId, dayId){
  const it = STATE.itineraries.find(x=>x.id===itId); if(!it) return;

}
function duplicateItinerary(id){
  const it = STATE.itineraries.find(x=>x.id===id); if(!it) return;
  const c = JSON.parse(JSON.stringify(it));

  c.days=c.days.map(d=>({...d,id:uid()})); c.options=(c.options||[]).map(o=>({...o,id:uid()}));

// ---------- AI Itinerary Assistant (multi-language) ----------
async function generateAIItinerary(it, numDays, budget, interests){
  const { sys, usr } = buildAIPrompt(it, numDays, budget, interests);
  const text = await aiText(sys, usr, 1000);
  const m = text.match(/\[[\s\S]*\]/);
  const parsed = JSON.parse(m ? m[0] : text.replace(/```json|```/g,'').trim());
  if(!Array.isArray(parsed)) throw new Error('Unexpected AI response');
  return parsed;
}
function buildAIPrompt(it, numDays, budget, interests){
  const lang = it.language || 'English';
  const sys = `You are a meticulous travel itinerary planner for an Indian travel agency. Respond with ONLY a raw JSON array, no markdown fences and no commentary. Each element must be {"title":"...","hotel":"...","transport":"...","notes":"..."}. Write the VALUES in ${lang}, but keep the JSON keys in English exactly as given. Keep every field brief.`;
  const usr = `Plan ${numDays} day(s) in ${it.destination} for ${it.pax} traveller(s). Traveller type: ${it.travellerType||'Family'}. Pace: ${it.travelPace||'Balanced'}. Budget level: ${budget}. Interests: ${interests||'general sightseeing'}. Return exactly ${numDays} array elements in day order.`;
  return { sys, usr };
}
function applyAIPlan(it, plan){
  const base = it.startDate || todayISO();
  it.days = plan.map((p,i)=>({id:uid(), date:addDays(base,i), title:p.title||'', hotel:p.hotel||'', transport:p.transport||'', notes:p.notes||'', photo:''}));
  if(it.days.length) it.endDate = it.days[it.days.length-1].date;
  saveState(); render();
}
function aiCopyPrompt(itId){
  const it = STATE.itineraries.find(x=>x.id===itId); if(!it) return;
  const { sys, usr } = buildAIPrompt(it, Number($('#ai-days').value)||3, $('#ai-budget').value, $('#ai-interests').value);
  const text = sys + '\n\n' + usr;
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Prompt copied — paste it into ChatGPT / Gemini / claude.ai'); }
  catch(e){ toast('Could not copy automatically','warn'); }
  ta.remove();
}
function aiPasteResult(itId){
  const it = STATE.itineraries.find(x=>x.id===itId); if(!it) return;
  openModal({ title:'Paste the AI reply', wide:true,
    bodyHTML:`<p class="text-xs text-muted mb-2">Paste the whole reply. It should be a JSON list starting with <span class="font-mono">[</span>. Extra text around it is fine.</p>
      <textarea id="ai-paste" rows="12" placeholder='[{"title":"Arrival in Hanoi","hotel":"...","transport":"...","notes":"..."}, ...]'></textarea>`,
    footHTML:`<div class="flex justify-end gap-2"><button class="btn btn-outline" data-action="modal-close">Cancel</button>
      <button class="btn btn-primary" id="ai-paste-btn">Import days</button></div>`,
    onMount:()=>{ $('#ai-paste-btn').addEventListener('click', ()=>{
      const raw = $('#ai-paste').value;
      const m = raw.match(/\[[\s\S]*\]/);
      try{
        const plan = JSON.parse(m ? m[0] : raw);
        if(!Array.isArray(plan) || !plan.length) throw new Error('empty');
        closeModal(); applyAIPlan(it, plan); toast(`${plan.length} days imported — review before sending`);
      }catch(e){ toast('That does not look like a valid JSON list — ask the AI to reply with JSON only','err'); }
    }); }});
}
async function handleAIGenerate(itId){
  const it = STATE.itineraries.find(x=>x.id===itId); if(!it) return;
  const days = Number($('#ai-days').value)||3;
  const btn=$('#ai-generate-btn'), st=$('#ai-status');
  btn.disabled=true; btn.textContent='Generating…';
  st.classList.remove('hidden'); st.textContent=`Drafting a ${days}-day plan in ${it.language||'English'}…`;
  try{
    const plan = await generateAIItinerary(it, days, $('#ai-budget').value, $('#ai-interests').value);
    applyAIPlan(it, plan); toast('AI draft inserted — review before sending');
  }catch(err){
    console.error(err);
    st.textContent = (aiReady() ? 'Could not generate right now ('+(err.message||'error')+'). ' : aiNotSetupMessage()+' ') + 'You can still build the plan manually below.';
    btn.disabled=false; btn.textContent='Generate';
    toast(aiReady() ? 'AI generation failed' : 'Add an AI key in Settings first','err');
  }
}

async function computeDistances(id){
  const it = STATE.itineraries.find(x=>x.id===id); if(!it) return;
  if(!CONFIG.mapsApiKey){ toast('Add a Google Maps API key in Settings','warn'); return; }
  const stops = it.days.map(d=>d.hotel ? `${d.hotel}, ${it.destination}` : '');
  let done=0;
  toast('Calculating distances…');
  for(let i=1;i<it.days.length;i++){
    const from=stops[i-1], to=stops[i];
    if(!from||!to||from===to){ it.days[i].distanceFromPrev=''; it.days[i].durationFromPrev=''; continue; }
    try{
      const resp = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Goog-Api-Key':CONFIG.mapsApiKey,
                 'X-Goog-FieldMask':'routes.distanceMeters,routes.duration'},
        body: JSON.stringify({ origin:{address:from}, destination:{address:to}, travelMode:'DRIVE' })
      });
      const data = await resp.json();
      const r = data.routes && data.routes[0];
      if(r){
        it.days[i].distanceFromPrev = (r.distanceMeters/1000).toFixed(0)+' km';
        const secs = parseInt(String(r.duration||'0s'));
        it.days[i].durationFromPrev = secs>=3600 ? `${Math.floor(secs/3600)}h ${Math.round((secs%3600)/60)}m` : `${Math.round(secs/60)} min`;
        done++;
      }
    }catch(err){ console.error(err); }
  }
  saveState(); render();
  toast(done ? `Distances added for ${done} leg(s)` : 'No routes found — check hotel names and your Maps key', done?'ok':'warn');
}

function itineraryToBooking(itId){
  const it = STATE.itineraries.find(x=>x.id===itId); if(!it) return;
  if(STATE.bookings.some(b=>b.itineraryId===itId)){ toast('This itinerary is already booked','warn'); return; }
  STATE.bookings.push({id:uid(), itineraryId:itId, clientName:it.clientName, destination:it.destination,
    startDate:it.startDate, endDate:it.endDate, pax:it.pax, status:'Confirmed',
    costPrice:it.costPrice, sellPrice:it.sellPrice, handledBy:'', companyId:null});
  it.status='Confirmed';
  if(it.leadId){ const l=STATE.leads.find(x=>x.id===it.leadId); if(l) l.stage='Won'; }
  saveState(); render(); toast('Booking created from itinerary');
}

// Daily programme message for travellers on an active trip
function waDailyProgramme(id){
  const b = STATE.bookings.find(x=>x.id===id); if(!b) return;
  const it = STATE.itineraries.find(x=>x.id===b.itineraryId);
  const s = STATE.settings;
  const today = todayISO();
  const day = it?.days.find(d=>d.date===today) || it?.days[0];
  const idx = it ? it.days.findIndex(d=>d.id===day?.id) : -1;
  const text = day
    ? `Good morning ${b.clientName}! 🌅\n\n*Day ${idx+1} — ${fmtDate(day.date)}*\n${day.title}\n\n${day.notes||''}\n\n🏨 Stay: ${day.hotel||'—'}\n🚐 Transport: ${day.transport||'—'}\n\nPickup time: ____\nDriver: ____ (contact ____)\n\nHave a wonderful day!\n— ${s.ceoName}, ${s.agencyName}`
    : `Good morning ${b.clientName}! Wishing you a wonderful day on your ${b.destination} trip.\n— ${s.ceoName}, ${s.agencyName}`;
  const phone = clientPhone(b.clientName);
  openModal({
    title:'Daily programme message', wide:true,
    bodyHTML:`<label class="field-label">Message</label><textarea id="wa-text" rows="12">${esc(text)}</textarea>
      <div class="mt-3"><label class="field-label">Send to</label><input type="text" id="wa-phone" value="${esc(phone)}" placeholder="+91…"></div>

      ${backendReady()?`<button class="btn btn-primary" data-action="wa-auto">Send automatically</button>`:''}<button class="btn btn-wa" id="wa-send-btn">Open in WhatsApp</button></div>`,
    onMount:()=>{ $('#wa-send-btn').addEventListener('click', ()=>{ openWhatsApp($('#wa-phone').value, $('#wa-text').value); closeModal(); }); }

  const bOpts = STATE.bookings.map(b=>({value:b.id,label:`${b.clientName} — ${b.destination}`}));
  openFormModal({
    title:'New invoice', wide:true, submitLabel:'Create invoice',
    fields:[
      bOpts.length?{name:'bookingId', label:'Link to booking (optional)', type:'select', options:[{value:'',label:'— none —'},...bOpts], value:booking?.id, full:true}:null,
      {name:'clientName', label:'Client name', required:true, value:booking?.clientName, full:true},
      {name:'type', label:'Invoice type', type:'select', options:INVOICE_TYPES, value:'Package Tour'},
      {name:'gstRate', label:'GST %', type:'number', value:5, step:'0.1'},
      {name:'amount', label:'Base amount (before GST)', type:'number', required:true, value:booking?.sellPrice},
      {name:'date', label:'Invoice date', type:'date', value:todayISO()},
    ],
    onSubmit:(d)=>{
      const gst = Math.round((d.amount||0)*(d.gstRate||0)/100);
      STATE.invoices.push({id:uid(), invoiceNo:nextInvoiceNo(), bookingId:d.bookingId||null, clientName:d.clientName,

      closeModal(); saveState(); render(); toast('Invoice created');

    onMount:()=>{

      t?.addEventListener('change', ()=>{ g.value = defaultGstFor(t.value); });
    }
  });

      {name:'amount', label:`Amount (balance ${fmtMoney(Math.max(pending,0))})`, type:'number', required:true, value:Math.max(pending,0), full:true},
      {name:'mode', label:'Mode', type:'select', options:['UPI','Cash','Bank Transfer','Credit Card','Debit Card','Cheque'], full:true},
      {name:'reference', label:'Reference / UTR', value:'', full:true},

function visaModal(id=null){
  const v = id ? STATE.visaCases.find(x=>x.id===id) : null;
  const countries = Object.keys(VISA_CHECKLISTS);
  const docsFor = (c) => (VISA_CHECKLISTS[c]||VISA_CHECKLISTS['Other / Custom']).map(l=>({label:l, done:false}));
  const currentDocs = v ? (v.docs||[]) : docsFor(countries[0]);
  const docsHTML = (docs) => docs.map((d,i)=>`
    <label class="flex items-start gap-2 text-sm mb-2">
      <input type="checkbox" data-doc="${i}" class="w-4 h-4 mt-0.5 shrink-0" ${d.done?'checked':''}>
      <span>${esc(d.label)}</span></label>`).join('');

  openModal({
    title: v?'Visa case':'New visa case', wide:true,
    bodyHTML:`<form id="generic-form" class="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
        ${fieldHTML({name:'clientName', label:'Client name', required:true, value:v?.clientName, full:true})}
        ${fieldHTML({name:'phone', label:'Phone', value:v?.phone})}
        <div class="sm:col-span-2 mb-3 flex items-center gap-2">
          ${aiReady()?`<button type="button" class="btn btn-outline btn-sm" id="scan-passport-btn">📷 Scan passport</button>
            <span class="text-[11px] text-muted">Reads name, passport no., DOB, expiry and nationality from a photo.</span>`
            :`<span class="text-[11px] text-muted">Passport scanning is available once the backend is connected in Settings.</span>`}
        </div>
        ${fieldHTML({name:'passportNo', label:'Passport number', value:v?.passportNo})}
        ${fieldHTML({name:'nationality', label:'Nationality', value:v?.nationality})}
        ${fieldHTML({name:'dob', label:'Date of birth', type:'date', value:v?.dob})}
        ${fieldHTML({name:'passportExpiry', label:'Passport expiry', type:'date', value:v?.passportExpiry})}
        ${fieldHTML({name:'country', label:'Destination country', type:'select', options:countries, value:v?.country||countries[0]})}
        ${fieldHTML({name:'visaType', label:'Visa type', value:v?.visaType})}
        ${fieldHTML({name:'appliedOn', label:'Applied on', type:'date', value:v?.appliedOn})}
        ${fieldHTML({name:'stage', label:'Stage', type:'select', options:VISA_STAGES.map(s=>s.key), value:v?.stage||'Document Collected'})}
        ${fieldHTML({name:'notes', label:'Notes', type:'textarea', value:v?.notes, full:true})}
        <div class="sm:col-span-2">
          <label class="field-label">Document checklist</label>
          <div id="visa-docs">${docsHTML(currentDocs)}</div>
          <button type="button" class="chip-btn mt-1" id="reload-docs-btn">Reload checklist for selected country</button>
        </div></form>`,
    footHTML:`<div class="flex items-center justify-between gap-2">
        <div>${v?`<button type="button" class="btn btn-danger btn-sm" id="del-visa-btn">Delete</button>`:''}</div>
        <div class="flex gap-2"><button type="button" class="btn btn-outline" data-action="modal-close">Cancel</button>
        <button type="submit" form="generic-form" class="btn btn-primary">${v?'Save changes':'Create case'}</button></div></div>`,
    onMount:()=>{
      let docs = currentDocs.map(d=>({...d}));
      const rebind = () => {
        $('#visa-docs').innerHTML = docsHTML(docs);
        $$('#visa-docs input[type=checkbox]').forEach(cb=>cb.addEventListener('change', ()=>{ docs[Number(cb.dataset.doc)].done = cb.checked; }));
      };
      rebind();
      $('#scan-passport-btn')?.addEventListener('click', async ()=>{
        const file = await pickImage(); if(!file) return;
        const b=$('#scan-passport-btn'); b.disabled=true; b.textContent='Reading…';
        try{
          const f = await aiOcr('ocr_passport', file);
          const set=(n,v)=>{ const el=document.querySelector(`[name="${n}"]`); if(el && v) el.value=v; };
          set('clientName', f.fullName); set('passportNo', f.passportNumber); set('nationality', f.nationality);
          set('dob', f.dateOfBirth); set('passportExpiry', f.expiryDate);
          toast('Passport details filled — please verify against the document');
        }catch(err){ console.error(err); toast('Could not read the passport image','err'); }
        finally{ b.disabled=false; b.textContent='📷 Scan passport'; }
      });
      $('#reload-docs-btn').addEventListener('click', ()=>{
        docs = docsFor(document.querySelector('select[name="country"]').value); rebind(); });
      $('#generic-form').addEventListener('submit', e=>{
        e.preventDefault();
        const fd=new FormData(e.target);
        const data={clientName:fd.get('clientName'), phone:fd.get('phone'), country:fd.get('country'),
          visaType:fd.get('visaType'), appliedOn:fd.get('appliedOn'), stage:fd.get('stage'), notes:fd.get('notes'), docs,
          passportNo:fd.get('passportNo'), nationality:fd.get('nationality'), dob:fd.get('dob'), passportExpiry:fd.get('passportExpiry')};
        if(v) Object.assign(v,data); else STATE.visaCases.push({id:uid(), ...data});
        closeModal(); saveState(); render(); toast(v?'Visa case updated':'Visa case created');
      });
      $('#del-visa-btn')?.addEventListener('click', ()=>{ closeModal();
        confirmDialog('Delete this visa case?', ()=>{ STATE.visaCases=STATE.visaCases.filter(x=>x.id!==id); saveState(); render(); toast('Visa case deleted'); }); });
    }
  });
}
function waVisaChecklist(id){
  const v = STATE.visaCases.find(x=>x.id===id); if(!v) return;
  const s = STATE.settings;
  const pending = (v.docs||[]).filter(d=>!d.done);
  const text = `Hello ${v.clientName},\n\nFor your *${v.country}* visa application, we still need:\n\n${pending.map(d=>`☐ ${d.label}`).join('\n') || 'Nothing — all documents received. ✅'}\n\nPlease share these at your convenience so we can proceed.\n\n— ${s.ceoName}, ${s.agencyName}`;
  quickWaModal('Send visa checklist', text, v.phone || clientPhone(v.clientName));
}

let taskFilter='all';
VIEWS.tasks = function(){
  let rows=[...STATE.tasks];
  if(taskFilter==='today') rows=rows.filter(t=>!t.done&&t.dueDate===todayISO());
  if(taskFilter==='overdue') rows=rows.filter(t=>!t.done&&t.dueDate<todayISO());
  if(taskFilter==='done') rows=rows.filter(t=>t.done);
  rows.sort((a,b)=>(a.done-b.done)||a.dueDate.localeCompare(b.dueDate));
  const cols=[
    {label:'', render:r=>`<input type="checkbox" class="w-4 h-4" data-action="toggle-task" data-id="${r.id}" ${r.done?'checked':''}>`},
    {label:'Task', render:r=>`<span class="${r.done?'line-through text-muted':''}">${esc(r.title)}</span>`},
    {key:'assignee', label:'Assignee'},
    {key:'relatedTo', label:'Related to'},
    {label:'Due', render:r=>{const o=!r.done&&r.dueDate<todayISO(); return `<span class="${o?'text-danger font-semibold':''}">${fmtDateShort(r.dueDate)}</span>`;}},
    {label:'', render:r=>`<div class="flex justify-end"><button class="chip-btn" data-action="edit-task" data-id="${r.id}">Edit</button></div>`},
  ];
  return `<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex gap-2 flex-wrap">
        ${[['all','All'],['today','Due today'],['overdue','Overdue'],['done','Completed']]

function feedbackModal(prefillName=''){
  openFormModal({ title:'Log client feedback', wide:true, submitLabel:'Save feedback',
    fields:[
      {name:'clientName', label:'Client name', required:true, value:prefillName, full:true},
      {name:'rating', label:'Rating (1–5)', type:'number', value:5},
      {name:'date', label:'Date', type:'date', value:todayISO()},
      {name:'comment', label:'Comment', type:'textarea', full:true},
    ],
    onSubmit:(d)=>{
      const rating = Math.min(5, Math.max(1, Number(d.rating)||5));
      STATE.feedback.push({id:uid(), clientName:d.clientName, rating, comment:d.comment, date:d.date||todayISO(), bookingId:null});
      closeModal(); saveState(); render();

      else toast('Feedback saved');
    }});

function waReviewRequest(id){
  const f=STATE.feedback.find(x=>x.id===id); if(!f) return;
  const s=STATE.settings;
  const text=`Hello ${f.clientName},\n\nThank you so much for the ${f.rating}★ feedback — it means a lot to our small team. 🙏\n\nIf you have a moment, would you mind sharing it as a Google review? It genuinely helps other travellers find us:\n${s.googleReviewUrl}\n\nWarm regards,\n${s.ceoName}\n${s.agencyName}`;
  quickWaModal('Request a Google review', text, clientPhone(f.clientName));
}
function feedbackLink(name){
  const s=STATE.settings;
  const q = new URLSearchParams({ c:name, a:s.agencyName, g:s.googleReviewUrl||'' });
  return publicBase()+'feedback.html?'+q.toString();
}
function requestFeedback(enc){
  const name=decodeURIComponent(enc), s=STATE.settings;
  const link = feedbackLink(name);
  const text=`Hello ${name},\n\nWe hope you had a wonderful trip! 🌏\n\nIt would mean a lot if you could rate your experience — it takes 30 seconds:\n${link}\n\nWarm regards,\n${s.ceoName}\n${s.agencyName}`;
  quickWaModal('Request post-trip feedback', text, clientPhone(name));
}
async function fetchWebFeedback(){
  if(SYNC!=='online'){ toast('Connect team sync first','warn'); return; }
  try{
    const { data, error } = await SB.from('feedback_public').select('*').eq('imported', false);
    if(error) throw error;
    if(!data || !data.length){ toast('No new web feedback'); return; }
    for(const f of data){
      STATE.feedback.push({id:uid(), clientName:f.client_name||'Website visitor', rating:Number(f.rating)||0,
        comment:f.comment||'', date:(f.created_at||'').slice(0,10)||todayISO(), bookingId:null});
      await SB.from('feedback_public').update({imported:true}).eq('id', f.id);
    }
    saveState(); render(); toast(`${data.length} feedback entr${data.length===1?'y':'ies'} imported`);
  }catch(err){ console.error(err); toast('Could not fetch feedback — run the setup SQL for feedback_public','err'); }
}

function showAuthGate(msg){
  $('#auth-gate').classList.remove('hidden');
  if(msg){ const m=$('#auth-msg'); m.textContent=msg; m.classList.remove('hidden'); }
}
function hideAuthGate(){ $('#auth-gate').classList.add('hidden'); }

async function doSignIn(){
  const email=$('#auth-email').value.trim(), pass=$('#auth-pass').value;
  const m=$('#auth-msg'); m.classList.add('hidden');
  if(!SB){ m.textContent='Backend not configured.'; m.classList.remove('hidden'); return; }
  const btn=$('#auth-signin-btn'); btn.disabled=true; btn.textContent='Signing in…';
  try{
    const { data, error } = await SB.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    SESSION = data.session; SYNC='online';
    const cloud = await sbLoadState();
    if(cloud){ STATE = cloud; backfillState(); await persistSet(STORAGE_KEY, JSON.stringify(STATE)); }
    else { await sbSaveState(); }
    hideAuthGate(); render(); toast('Signed in — team sync is on');
  }catch(err){
    console.error(err);
    m.textContent = (err && err.message) ? err.message : 'Sign in failed.';
    m.classList.remove('hidden');
  }finally{ btn.disabled=false; btn.textContent='Sign in'; }
}
async function signOut(){
  try{ await SB?.auth.signOut(); }catch(e){}
  SESSION=null; SYNC='local'; render(); toast('Signed out — working on this device');
}
async function pullFromCloud(){
  try{
    const cloud=await sbLoadState();
    if(!cloud){ toast('Nothing saved in the cloud yet','warn'); return; }
    STATE=cloud; backfillState(); await persistSet(STORAGE_KEY, JSON.stringify(STATE));
    render(); toast('Pulled the latest team data');
  }catch(err){ console.error(err); toast('Could not pull from cloud','err'); }
}

function handleClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action, id = t.dataset.id;
  switch(a){
    case 'modal-close': closeModal(); break;
    case 'nav': navigate(t.dataset.view, t.dataset.id||null); break;
    case 'toggle-menu': $('#sidebar').classList.toggle('open'); break;
    case 'open-palette': openPalette(); break;
    case 'palette-go': paletteGo(Number(t.dataset.i)); break;

    // leads
    case 'new-lead': openLeadModal(); break;
    case 'edit-lead': openLeadModal(id); break;
    case 'lead-wa': leadWhatsAppModal(id); break;
    case 'lead-log': leadLogModal(id); break;
    case 'lead-to-itinerary': newItineraryModal(id); break;
    case 'lead-view': leadView=t.dataset.v; render(); break;
    case 'fetch-inquiries': fetchInquiries(); break;
    case 'import-inquiry': importInquiry(id); break;

    // itineraries
    case 'new-itinerary': newItineraryModal(); break;
    case 'open-itinerary': navigate('itineraries', id); break;
    case 'compare-itineraries': compareItinerariesModal(); break;
    case 'duplicate-itinerary': duplicateItinerary(id); break;
    case 'delete-itinerary': confirmDialog('Delete this itinerary?', ()=>{
        STATE.itineraries=STATE.itineraries.filter(x=>x.id!==id); saveState(); navigate('itineraries'); toast('Itinerary deleted'); }); break;
    case 'add-day': addDay(id); break;
    case 'delete-day': deleteDay(t.dataset.id, t.dataset.day); break;
    case 'ai-generate': handleAIGenerate(id); break;
    case 'add-option': optionModal(id); break;
    case 'edit-option': optionModal(t.dataset.id, t.dataset.opt); break;
    case 'print-itinerary': printItinerary(id); break;
    case 'print-photo-itinerary': printPhotoItinerary(id); break;
    case 'fetch-photos': fetchPhotos(id); break;
    case 'ai-copy-prompt': aiCopyPrompt(id); break;
    case 'ai-paste-result': aiPasteResult(id); break;
    case 'print-comparison': printComparison(id); break;
    case 'make-flyer': makeFlyer(id); break;
    case 'wa-itinerary': waItinerary(id); break;
    case 'print-node': { const n=document.getElementById(t.dataset.target); if(n) printHTML(n.innerHTML); break; }

    // bookings
    case 'itinerary-to-booking': itineraryToBooking(id); break;
    case 'edit-booking': editBookingModal(id); break;
    case 'voucher-booking': printVoucher(id); break;
    case 'wa-daily': waDailyProgramme(id); break;
    case 'invoice-from-booking': newInvoiceModal(id); break;

    // money
    case 'new-invoice': newInvoiceModal(); break;
    case 'record-payment': recordPaymentModal(id); break;
    case 'print-invoice': printInvoice(id); break;
    case 'print-receipt': printReceipt(id); break;
    case 'wa-invoice': waInvoice(id); break;
    case 'wa-receipt': waReceipt(id); break;

    // visa
    case 'new-visa': visaModal(); break;
    case 'edit-visa': visaModal(id); break;
    case 'wa-visa': waVisaChecklist(id); break;

    // corporate
    case 'new-company': companyModal(); break;
    case 'edit-company': companyModal(id); break;
    case 'open-company': navigate('corporate', id); break;
    case 'add-employee': employeeModal(id); break;
    case 'remove-employee': {
      const c=STATE.companies.find(x=>x.id===t.dataset.id);
      if(c){ c.employees=c.employees.filter(x=>x.id!==t.dataset.emp); saveState(); render(); toast('Employee removed'); }
      break; }
    case 'employee-lead': {
      const c=STATE.companies.find(x=>x.id===t.dataset.id);
      const emp=c?.employees.find(x=>x.id===t.dataset.emp);
      if(emp) openLeadModal(null, {name:emp.name, phone:emp.phone, email:emp.email, source:'Corporate', travellerType:'Corporate group'});
      break; }

    // tasks / vendors / clients / feedback
    case 'toggle-task': toggleTask(id, t.checked); break;
    case 'task-filter': taskFilter=t.dataset.filter; render(); break;
    case 'new-task': taskModal(); break;
    case 'edit-task': taskModal(id); break;
    case 'new-vendor': vendorModal(); break;
    case 'edit-vendor': vendorModal(id); break;
    case 'open-client': navigate('clients', id); break;
    case 'wa-client': { const n=decodeURIComponent(id);
      quickWaModal('WhatsApp '+n, `Hello ${n},\n\n`, clientPhone(n)); break; }
    case 'request-feedback': requestFeedback(id); break;
    case 'new-feedback': feedbackModal(); break;
    case 'wa-review': waReviewRequest(id); break;
    case 'fetch-feedback': fetchWebFeedback(); break;
    case 'share-itinerary': shareItinerary(id); break;
    case 'calc-distances': computeDistances(id); break;
    case 'scan-card': scanBusinessCard(); break;
    case 'wa-auto': {
      const phone = ($('#wa-phone')?.value || '').trim(), text = $('#wa-text')?.value || '';
      if(!waNumber(phone)){ toast('Enter a phone number first','warn'); break; }
      t.disabled=true; t.textContent='Sending…';
      callBackend('whatsapp_send', { to: waNumber(phone), text })
        .then(()=>{ closeModal(); toast('Sent via WhatsApp Business API'); })
        .catch(err=>{ console.error(err); t.disabled=false; t.textContent='Send automatically';
          toast(err.message.includes('24') ? 'Outside the 24-hour window — use a template or tap-to-send' : 'Auto-send failed: '+err.message, 'err'); });
      break; }

    // settings
    case 'save-settings': saveSettingsFromForm(); break;
    case 'add-team': addTeamModal(); break;
    case 'remove-team': {
      STATE.settings.team=STATE.settings.team.filter(x=>x.id!==id); saveState(); render(); toast('Team member removed'); break; }
    case 'save-integrations': saveIntegrations(); break;
    case 'save-backend': saveBackendSettings(); break;
    case 'test-backend': testBackend(); break;
    case 'save-ai-key': saveAIKey(); break;
    case 'test-ai-key': testAIKey(); break;
    case 'clear-ai-key': clearAIKey(); break;
    case 'show-sql': showSqlSetup(); break;
    case 'pull-cloud': pullFromCloud(); break;
    case 'sign-out': signOut(); break;
    case 'export-data': exportData(); break;
    case 'reset-data': resetAllData(); break;
    default: break;
  }
}

function handleChange(e){
  const t=e.target;
  if(t.id==='import-file'){ if(t.files && t.files[0]) importData(t.files[0]); return; }
  const a=t.dataset ? t.dataset.action : null;
  if(a==='itin-field'){ updateItineraryField(t.dataset.id||ROUTE.id, t.dataset.field, t.value); render(); return; }
  if(a==='itin-list'){ updateItineraryList(ROUTE.id, t.dataset.field, t.value); return; }
  if(a==='day-field'){ updateDayField(t.dataset.id, t.dataset.day, t.dataset.field, t.value); return; }
  if(a==='lead-owner-filter'){ leadFilterOwner=t.value; render(); return; }
}

function wireGlobalEvents(){
  document.body.addEventListener('click', handleClick);
  document.body.addEventListener('change', handleChange);
  document.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
    if(e.key==='/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ e.preventDefault(); openPalette(); return; }
    if(e.key==='Escape'){ closeModal(); closePalette(); }
  });
  $('#auth-signin-btn').addEventListener('click', doSignIn);
  $('#auth-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doSignIn(); });
  $('#auth-offline-btn').addEventListener('click', ()=>{ SYNC='offline-forced'; hideAuthGate(); render(); toast('Working offline on this device'); });
}

// =========================================================================
// BOOTSTRAP
// =========================================================================
async function init(){
  // config (integration keys) is per-device and never synced
  try{ const c = await persistGet(CONFIG_KEY); if(c) CONFIG = Object.assign(CONFIG, JSON.parse(c)); }catch(e){}

  const had = await loadLocalState();
  if(!had){ STATE = defaultState(); seedDemoData(); }
  backfillState();

  window.addEventListener('hashchange', route);
  wireGlobalEvents();

  if(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey && initSupabaseClient()){
    try{
      const { data } = await SB.auth.getSession();
      if(data && data.session){
        SESSION = data.session; SYNC='online';
        const cloud = await sbLoadState();
        if(cloud){ STATE = cloud; backfillState(); }
      } else {
        route(); showAuthGate(); return;
      }
    }catch(err){ console.error(err); SYNC='local'; }
  }

  if(!had) await saveState();
  route();
}
init();
</script>
